name: Build & Deploy

on:
  push:
    branches: [dev]

jobs:
  # ─── Fetch latest build number from both stores ───────────────────────────
  prepare:
    name: Compute Build Number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.compute.outputs.build_number }}

    steps:
      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth PyJWT cryptography requests

      - name: Fetch latest build numbers from stores
        id: compute
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ANDROID_PACKAGE_NAME: com.Dictionary
          IOS_BUNDLE_ID: com.example.dilduel.app
        run: |
          python3 << 'PYTHON'
          import os, json, time, base64, requests
          import jwt
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          android_build = 0
          ios_build = 0

          # ── Android: latest version code from Google Play ──────────────
          try:
              sa_json = json.loads(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
              credentials = service_account.Credentials.from_service_account_info(
                  sa_json,
                  scopes=['https://www.googleapis.com/auth/androidpublisher']
              )
              service = build('androidpublisher', 'v3', credentials=credentials)
              package = os.environ['ANDROID_PACKAGE_NAME']
              edit = service.edits().insert(packageName=package, body={}).execute()
              edit_id = edit['id']
              tracks = service.edits().tracks().list(
                  packageName=package, editId=edit_id
              ).execute()
              service.edits().delete(packageName=package, editId=edit_id).execute()
              for track in tracks.get('tracks', []):
                  for release in track.get('releases', []):
                      for vc in release.get('versionCodes', []):
                          android_build = max(android_build, int(vc))
              print(f"Latest Android build: {android_build}")
          except Exception as e:
              print(f"Android lookup failed (will fallback): {e}")

          # ── iOS: latest build number from App Store Connect ────────────
          try:
              key_id = os.environ['APP_STORE_CONNECT_API_KEY_ID']
              issuer_id = os.environ['APP_STORE_CONNECT_ISSUER_ID']
              private_key = base64.b64decode(
                  os.environ['APP_STORE_CONNECT_API_KEY_BASE64']
              ).decode()
              now = int(time.time())
              token = jwt.encode(
                  {"iss": issuer_id, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id}
              )
              headers = {"Authorization": f"Bearer {token}"}
              bundle_id = os.environ['IOS_BUNDLE_ID']
              r = requests.get(
                  "https://api.appstoreconnect.apple.com/v1/apps",
                  headers=headers,
                  params={"filter[bundleId]": bundle_id}
              )
              apps = r.json().get('data', [])
              if apps:
                  app_id = apps[0]['id']
                  r2 = requests.get(
                      "https://api.appstoreconnect.apple.com/v1/builds",
                      headers=headers,
                      params={"filter[app]": app_id, "sort": "-version", "limit": 1}
                  )
                  builds = r2.json().get('data', [])
                  if builds:
                      ios_build = int(builds[0]['attributes']['version'])
              print(f"Latest iOS build: {ios_build}")
          except Exception as e:
              print(f"iOS lookup failed (will fallback): {e}")

          # ── Use highest + 1, fallback to run number if both failed ─────
          if android_build == 0 and ios_build == 0:
              new_build = int(os.environ.get('GITHUB_RUN_NUMBER', 1)) + 5
              print(f"Both lookups failed, using fallback: {new_build}")
          else:
              new_build = max(android_build, ios_build) + 1

          print(f"New build number: {new_build}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"build_number={new_build}\n")
          PYTHON

  # ─── Android ──────────────────────────────────────────────────────────────
  build-android:
    name: Build & Deploy Android
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode > android/app/google-services.json

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > dilduel-key.jks

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore dilduel-key.jks \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -storetype PKCS12 2>/dev/null \
          || keytool -list \
            -keystore dilduel-key.jks \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}"

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$(pwd)/dilduel-key.jks
          EOF

      - run: flutter pub get

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --target=lib/mains/prod/main.dart \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.Dictionary
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: internal
          status: completed

  # ─── iOS ──────────────────────────────────────────────────────────────────
  build-ios:
    name: Build & Deploy iOS
    runs-on: macos-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLESERVICE_INFO_PLIST_BASE64 }}" \
            | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install App Store provisioning profile
        run: |
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 --decode > "$PROFILES_DIR/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" \
            | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          PROFILE_NAME=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" \
            | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      - run: flutter pub get

      - name: Switch Xcode project to manual signing
        run: |
          python3 << 'PYTHON'
          import os
          uuid = os.environ['PROFILE_UUID']
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          replacement = (
              'PRODUCT_BUNDLE_IDENTIFIER = com.example.dilduel.app;\n'
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{uuid}";'
          )
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = com.example.dilduel.app;',
              replacement
          )
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          print(f'Updated pbxproj with profile UUID: {uuid}')
          PYTHON

      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>DPKFU7J628</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.dilduel.app</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build iOS IPA
        run: |
          flutter build ipa --release \
            --target=lib/mains/prod/main.dart \
            --build-number=${{ needs.prepare.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Decode App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" \
            | base64 --decode \
            > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$(find build/ios/ipa -name '*.ipa' | head -1)" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --verbose
