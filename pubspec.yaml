name: flutter_dic
description: "DilDuel — a German–Azerbaijani dictionary with quizzes, training and bookmarks."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & dependency injection
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.2
  injectable: ^2.3.0
  dartz: ^0.10.1

  # Local data
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.6.0

  # Firebase & sign-in
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Localization
  easy_localization: ^3.0.7+1
  easy_logger: ^0.0.2

  # UI & platform
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.2
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  checks: ^0.3.1
  fake_async: ^1.3.3

  # Code generation
  build_runner: ^2.4.6
  injectable_generator: ^2.4.1

  # Icons & splash (run via `dart run flutter_launcher_icons` and
  # `dart run flutter_native_splash:create`)
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#4A3AD1"
  image: assets/icon.png
  color_dark: "#4A3AD1"
  image_dark: assets/icon.png
  ios: true
  android: true
  web: false
  android_12:
    color: "#4A3AD1"
    image: assets/icon.png
    icon_background_color: "#4A3AD1"
    color_dark: "#4A3AD1"
    image_dark: assets/icon.png
    icon_background_color_dark: "#4A3AD1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4A3AD1"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/luget.db
    - assets/translations/
